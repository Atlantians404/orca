services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orca-backend
    ports:
      - "10000:10000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://orca:orca@postgres:5432/orca
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: orca-postgres
    environment:
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
      POSTGRES_DB: orca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca -d orca"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: